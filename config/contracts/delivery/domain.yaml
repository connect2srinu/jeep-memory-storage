apiVersion: memory.platform/v1alpha1
kind: MemoryDomain
metadata:
  name: delivery
  displayName: Delivery
  version: "1.0"
  owner:
    team: delivery-platform
spec:
  isolation: standard
  scopes:
    profileScopeKeys: [user_id, app_name, domain]
  permissions:
    read: [delivery, customer, grocery]
    write: [delivery]
  dynamicMemory:
    enabled: true
    keyPattern: "^delivery\\.[a-z][a-z0-9_]*$"
    minimumConfidence: 0.70
    requireExplicitStatement: true
