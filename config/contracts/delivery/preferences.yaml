apiVersion: memory.platform/v1alpha1
kind: PreferenceCatalog
metadata:
  domain: delivery
  version: "1.0"
preferences:
  - key: delivery.preferred_window
    type: string
    description: Preferred delivery time window
    ownerDomain: delivery
    canonical: true
    sensitivity: normal
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [delivery, grocery]
    allowedWriters: [delivery]
    resolutionPolicy: preferred_window
    profile: delivery-preferences-v1
    aliases: [preferred_window]
