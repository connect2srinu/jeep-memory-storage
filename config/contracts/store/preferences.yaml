apiVersion: memory.platform/v1alpha1
kind: PreferenceCatalog
metadata:
  domain: store
  version: "1.0"
preferences:
  - key: store.preferred_product_type
    type: string
    description: Store-level preferred product type
    ownerDomain: store
    canonical: true
    sensitivity: normal
    scopes: [LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [store, grocery]
    allowedWriters: [store]
    resolutionPolicy: preferred_product_type
    profile: store-preferences-v1
    aliases: []
