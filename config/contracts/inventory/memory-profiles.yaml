apiVersion: memory.platform/v1alpha1
kind: MemoryProfiles
metadata:
  domain: inventory
  version: "1.0"
profiles:
  - id: inventory-preferences-v1
    memoryType: STRUCTURED_PROFILE
    ownerDomain: inventory
    scopeKeys: [user_id, app_name, domain]
    fields:
      - preference: inventory.preferred_store
        profileField: preferred_store
    generation:
      enabled: false
      sources: [EXPLICIT_PROFILE_SYNC]
      inferredFieldsAllowed: false
      requireUserConfirmation: []
