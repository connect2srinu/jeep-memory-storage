apiVersion: memory.platform/v1alpha1
kind: MemoryConsumers
metadata:
  domain: inventory
  version: "1.0"
consumers:
  - agentId: inventory-agent
    consumerDomain: inventory
    requiredPreferences:
      - inventory.preferred_store
    capabilities:
      resolveContext: true
      submitCandidates: true
      inspectProvenance: true
      administerMemory: false
