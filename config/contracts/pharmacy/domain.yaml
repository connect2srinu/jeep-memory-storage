apiVersion: memory.platform/v1alpha1
kind: MemoryDomain
metadata:
  name: pharmacy
  displayName: Pharmacy
  version: "1.0"
  owner:
    team: pharmacy-platform
spec:
  isolation: strict
  scopes:
    profileScopeKeys: [user_id, app_name, domain]
  permissions:
    read: [pharmacy]
    write: [pharmacy]
  dynamicMemory:
    enabled: false
