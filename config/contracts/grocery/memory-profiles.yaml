apiVersion: memory.platform/v1alpha1
kind: MemoryProfiles
metadata:
  domain: grocery
  version: "1.0"
profiles:
  - id: grocery-preferences-v1
    memoryType: STRUCTURED_PROFILE
    ownerDomain: grocery
    scopeKeys: [user_id, app_name, domain]
    fields:
      - preference: grocery.preferred_store
        profileField: preferred_store
      - preference: grocery.dietary_preference
        profileField: dietary_preference
      - preference: grocery.allow_substitutions
        profileField: allow_substitutions
      - preference: grocery.organic_preference
        profileField: organic_preference
      - preference: grocery.preferred_brand
        profileField: preferred_brand
      - preference: grocery.preferred_milk
        profileField: preferred_milk
      - preference: grocery.preferred_product_type
        profileField: preferred_product_type
      - preference: grocery.preferred_snack
        profileField: preferred_snack
    generation:
      enabled: true
      sources: [CONFIRMED_PREFERENCE_CANDIDATE, SESSION_EVENTS]
      inferredFieldsAllowed: false
      requireUserConfirmation: [allow_substitutions, preferred_milk]
