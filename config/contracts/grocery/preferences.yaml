apiVersion: memory.platform/v1alpha1
kind: PreferenceCatalog
metadata:
  domain: grocery
  version: "1.0"
preferences:
  - key: grocery.preferred_store
    type: string
    description: Grocery-context preferred store identifier
    ownerDomain: grocery
    canonical: true
    sensitivity: normal
    scopes: [LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery]
    allowedWriters: [grocery]
    resolutionPolicy: preferred_store
    profile: grocery-preferences-v1
    aliases: [preferred_store]

  - key: grocery.dietary_preference
    type: string
    description: Grocery-context dietary preference
    ownerDomain: grocery
    canonical: true
    sensitivity: sensitive
    scopes: [LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery]
    allowedWriters: [grocery]
    resolutionPolicy: dietary_preference
    profile: grocery-preferences-v1
    aliases: [dietary_preference]

  - key: grocery.allow_substitutions
    type: boolean
    description: Whether grocery substitutions are permitted
    ownerDomain: grocery
    canonical: true
    sensitivity: normal
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery, store, delivery]
    allowedWriters: [grocery]
    resolutionPolicy: allow_substitutions
    profile: grocery-preferences-v1
    aliases: [allow_substitutions]
    lifecycle:
      sessionTtlSeconds: 86400
      longTermRetentionDays: 365
    confirmation:
      requiredForLongTerm: true

  - key: grocery.organic_preference
    type: boolean
    description: Preference for organic grocery products
    ownerDomain: grocery
    canonical: true
    sensitivity: normal
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery, store]
    allowedWriters: [grocery]
    resolutionPolicy: organic_preference
    profile: grocery-preferences-v1
    aliases: [organic]

  - key: grocery.preferred_brand
    type: string
    description: Preferred grocery brand
    ownerDomain: grocery
    canonical: true
    sensitivity: normal
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery, store, delivery]
    allowedWriters: [grocery]
    resolutionPolicy: preferred_brand
    profile: grocery-preferences-v1
    aliases: [preferred_brand]

  - key: grocery.preferred_milk
    type: string
    description: Preferred milk type
    ownerDomain: grocery
    canonical: true
    sensitivity: normal
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery, store]
    allowedWriters: [grocery]
    resolutionPolicy: preferred_milk
    profile: grocery-preferences-v1
    aliases: [preferred_milk]

  - key: grocery.preferred_product_type
    type: string
    description: Grocery-owned product type preference
    ownerDomain: grocery
    canonical: true
    sensitivity: normal
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery, store, delivery]
    allowedWriters: [grocery]
    resolutionPolicy: preferred_product_type
    profile: grocery-preferences-v1
    aliases: [preferred_product, preferred_product_type]

  - key: grocery.preferred_snack
    type: string
    description: Grocery-owned preferred snack type preference
    ownerDomain: grocery
    canonical: true
    sensitivity: normal
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [grocery, store, delivery]
    allowedWriters: [grocery]
    resolutionPolicy: preferred_snack
    profile: grocery-preferences-v1
    aliases: [preferred_snack]
