apiVersion: memory.platform/v1alpha1
kind: PreferenceResolutionPolicies
metadata:
  domain: customer
  version: "1.0"
policies:
  - id: preferred_store
    appliesTo: [customer.preferred_store]
    domainPriority: [customer, grocery, inventory]

  - id: fulfillment_preference
    appliesTo: [customer.fulfillment_preference]
    domainPriority: [customer, grocery, delivery]

  - id: diet
    appliesTo: [customer.diet]
    domainPriority: [customer, grocery]

  - id: fruit
    appliesTo: [customer.fruit]
    domainPriority: [customer, grocery]
