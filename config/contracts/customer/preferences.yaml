apiVersion: memory.platform/v1alpha1
kind: PreferenceCatalog
metadata:
  domain: customer
  version: "1.0"
preferences:
  - key: customer.fulfillment_preference
    type: string
    description: User-confirmed order fulfillment preference
    ownerDomain: customer
    canonical: true
    sensitivity: normal
    scopes: [LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [customer, grocery, delivery]
    allowedWriters: [customer]
    resolutionPolicy: fulfillment_preference
    profile: customer-preferences-v1
    aliases: [fulfillment_preference]

  - key: customer.preferred_store
    type: string
    description: User-confirmed preferred store identifier
    ownerDomain: customer
    canonical: true
    sensitivity: normal
    scopes: [LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [customer, grocery, store, delivery]
    allowedWriters: [customer]
    resolutionPolicy: preferred_store
    profile: customer-preferences-v1
    aliases: [preferred_store]

  - key: customer.diet
    type: string
    description: User-confirmed dietary preference
    ownerDomain: customer
    canonical: true
    sensitivity: sensitive
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [customer, grocery]
    allowedWriters: [customer]
    resolutionPolicy: diet
    profile: customer-preferences-v1
    aliases: [diet]
    confirmation:
      requiredForLongTerm: true

  - key: customer.fruit
    type: string
    description: User-confirmed fruit preference
    ownerDomain: customer
    canonical: true
    sensitivity: sensitive
    scopes: [SESSION, LONG_TERM]
    schemaVersion: "1"
    allowedReaders: [customer, grocery]
    allowedWriters: [customer]
    resolutionPolicy: fruit
    profile: customer-preferences-v1
    aliases: [fruit]
    confirmation:
      requiredForLongTerm: true
