apiVersion: memory.platform/v1alpha1
kind: MemoryConsumers
metadata:
  domain: customer
  version: "1.0"
consumers:
  - agentId: customer-agent
    consumerDomain: customer
    requiredPreferences:
      - customer.preferred_store
      - customer.fulfillment_preference
      - customer.diet
      - customer.fruit
    capabilities:
      resolveContext: true
      submitCandidates: true
      inspectProvenance: true
      administerMemory: false
