apiVersion: memory.platform/v1alpha1
kind: MemoryConsumers
metadata:
  domain: replace_me
  version: "1.0"
consumers:
  - agentId: replace-me-agent
    consumerDomain: replace_me
    requiredPreferences: [replace_me.example_preference]
    capabilities:
      resolveContext: true
      submitCandidates: true
      inspectProvenance: true
      administerMemory: false
