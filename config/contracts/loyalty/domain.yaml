apiVersion: memory.platform/v1alpha1
kind: MemoryDomain
metadata:
  name: replace_me
  displayName: Replace Me
  version: "1.0"
  owner:
    team: replace-me-team
    email: replace-me@example.com
spec:
  isolation: standard
  scopes:
    profileScopeKeys: [user_id, app_name, domain]
  permissions:
    read: [replace_me]
    write: [replace_me]
  dynamicMemory:
    enabled: true
    keyPattern: "^replace_me\\.[a-z][a-z0-9_]*$"
    minimumConfidence: 0.70
    requireExplicitStatement: true
  defaults:
    retentionDays: 365
    inferredPreferenceTtlDays: 90
