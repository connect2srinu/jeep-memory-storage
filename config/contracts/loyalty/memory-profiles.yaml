apiVersion: memory.platform/v1alpha1
kind: MemoryProfiles
metadata:
  domain: replace_me
  version: "1.0"
profiles:
  - id: replace-me-preferences-v1
    memoryType: STRUCTURED_PROFILE
    ownerDomain: replace_me
    scopeKeys: [user_id, app_name, domain]
    fields:
      - preference: replace_me.example_preference
        profileField: example_preference
    generation:
      enabled: true
      sources: [CONFIRMED_PREFERENCE_CANDIDATE, SESSION_EVENTS]
      inferredFieldsAllowed: false
      requireUserConfirmation: [example_preference]
