[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-plane-api"
version = "0.1.0"
description = "Control plane and agent runtime API for the GEAP platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.116,<1.0",
  "google-auth>=2.38,<3.0",
  "google-cloud-aiplatform[agent_engines]>=1.112,<3.0",
  "pydantic>=2.10,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "PyYAML>=6.0.2,<7.0",
  "SQLAlchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app/control_plane_api"]

[tool.pytest.ini_options]
pythonpath = ["app", "../.."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
