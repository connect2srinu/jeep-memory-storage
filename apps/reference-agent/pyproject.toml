[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-memory-reference-agent"
version = "0.1.0"
description = "ADK reference consumer for the Shared Memory API"
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-auth>=2.40,<3.0",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app/reference_agent"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
