[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geap-memory-agent"
version = "0.1.0"
description = "ADK agent with short-term memory in Cloud SQL / Postgres and long-term memory in Vertex AI Memory Bank"
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp,db]>=2.0.0,<3.0.0",
  "asyncpg>=0.30,<1.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app/memory_agent"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
