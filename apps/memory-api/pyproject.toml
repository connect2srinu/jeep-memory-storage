[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-memory-api"
version = "0.1.0"
description = "Runtime-independent Shared Memory Platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app/memory_api"]

[tool.pytest.ini_options]
pythonpath = ["app", "../.."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
