[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-preference-poc"
version = "0.1.0"
description = "Deterministic hierarchical preferences for a Google ADK grocery agent"
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-cloud-aiplatform[agent_engines,adk]>=1.112.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

