[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-memory-platform-poc"
version = "0.2.0"
description = "Domain-authorized Shared Memory Platform for Google ADK agents"
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-cloud-aiplatform[agent_engines,adk]>=1.112.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pydantic>=2.10,<3.0",
  "PyYAML>=6.0.2,<7.0",
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"app/shared_memory/catalog/catalog.json" = "app/shared_memory/catalog/catalog.json"
"app/shared_memory/policies/domain_policy.json" = "app/shared_memory/policies/domain_policy.json"
"app/shared_memory/policies/resolution_policy.json" = "app/shared_memory/policies/resolution_policy.json"
"app/shared_memory/profiles/memory_profiles.json" = "app/shared_memory/profiles/memory_profiles.json"
"app/shared_memory/contracts/consumers.json" = "app/shared_memory/contracts/consumers.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

