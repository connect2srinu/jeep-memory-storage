name: Memory contracts

on:
  pull_request:
    paths:
      - "config/contracts/**"
      - "app/shared_memory/contracts/**"
      - "scripts/validate_memory_contract.py"
      - "scripts/compile_memory_contract.py"
      - ".github/workflows/memory-contracts.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_memory_contract.py
      - run: python scripts/compile_memory_contract.py --check
      - run: python -m ruff check app apps scripts tests
      - run: python -m pytest -q
      - run: PYTHONPATH=apps/reference-agent/app python -m pytest -q apps/reference-agent/tests
      - run: PYTHONPATH=apps/memory-api/app:. python -m pytest -q apps/memory-api/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/admin-console/package-lock.json
      - working-directory: apps/admin-console
        run: npm ci
      - working-directory: apps/admin-console
        run: npm run build
      - working-directory: apps/admin-console
        run: npm test
      - working-directory: apps/admin-console
        run: npm audit --audit-level=moderate
