name: Platform CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shared_memory_test
          POSTGRES_USER: shared_memory
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shared_memory -d shared_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: >-
          python -m pip install
          -e 'apps/memory-api[dev]'
          -e 'apps/reference-agent[dev]'
      - run: python scripts/validate_deployment_security.py
      - run: python -m ruff check apps scripts tests
      - run: python -m pytest -q tests
      - run: PYTHONPATH=apps/reference-agent/app python -m pytest -q apps/reference-agent/tests
      - run: PYTHONPATH=apps/memory-api/app:apps/memory-api/tests python -m pytest -q apps/memory-api/tests
      - name: Apply control-plane migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://shared_memory:test-only@localhost:5432/shared_memory_test
        run: PYTHONPATH=apps/memory-api/app alembic -c apps/memory-api/alembic.ini upgrade head
      - name: PostgreSQL control-plane test
        env:
          RUN_POSTGRES_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql+asyncpg://shared_memory:test-only@localhost:5432/shared_memory_test
        run: >-
          PYTHONPATH=apps/memory-api/app:apps/memory-api/tests
          python -m pytest -q apps/memory-api/tests/test_postgres_control_plane.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/admin-console/package-lock.json
      - working-directory: apps/admin-console
        run: npm ci
      - working-directory: apps/admin-console
        run: npm run build
      - working-directory: apps/admin-console
        run: npm test
      - working-directory: apps/admin-console
        run: npm audit --audit-level=moderate
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run: terraform -chdir=infrastructure/terraform/environments/dev init -backend=false
      - run: terraform -chdir=infrastructure/terraform/environments/dev validate
